<body>
<div id="app" class="app" data-screen="boot">
  <div class="boot">
    <div class="boot-mark" aria-hidden="true">NT</div>
    <p class="boot-name">Noor Traders Hazri</p>
    <p class="boot-text" id="bootText">Khul raha hai…</p>
  </div>
</div>
<div id="sheetHost"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Is app ke liye browser mein JavaScript on honi chahiye.</p></noscript>
<script>
/* Agar app 12 second mein na khule to khali screen ke bajaye saaf paigham aur "Dobara kholein" button. */
window.__bootTimer=setTimeout(function(){var t=document.getElementById('bootText');if(!t||!document.querySelector('#app[data-screen=boot]'))return;t.innerHTML='Internet kamzor lag raha hai. <button type="button" onclick="location.reload()" class="btn btn-ghost" style="margin-top:12px">Dobara kholein</button>'},12000);
window.addEventListener('error',function(e){if(String(e.filename||'').indexOf('boot.js')>-1||/import|module/i.test(String(e.message||''))){var t=document.getElementById('bootText');if(t)t.textContent='App load nahi hui. Internet check kar ke page dobara kholein.'}});
</script>
<script type="module" src="./boot.js?v=207"></script>
</body>
